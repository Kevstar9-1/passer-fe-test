<mat-form-field appearance="fill">
  <mat-label>Ocupación</mat-label>
  <input type="text" matInput [formControl]="occupationControl" [matAutocomplete]="auto">
  <mat-autocomplete #auto="matAutocomplete">
    <mat-option *ngFor="let occupation of filteredOccupations$ | async" [value]="occupation.name">
      {{ occupation.name }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
