<!-- búsqueda-->
<mat-card class="country-filter-card">
  <mat-card-content>
    <h3>{{ 'country.search' | translate }}</h3>

    <mat-form-field class="country-display" appearance="fill">
      <input matInput placeholder="País" [formControl]="countryFilter">
    </mat-form-field>
  </mat-card-content>
</mat-card>

<!--Tabla-->
<div class="country-table-wrapper">
  <table mat-table [dataSource]="dataSource" class="country-table" matSort>

    <!--País-->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>{{ 'country.table.name' | translate }}</th>
      <td mat-cell *matCellDef="let element" (click)="selectRow(element)" [class.selected]="selectedRow === element">
        {{ element.name }}
      </td>
    </ng-container>

    <!--Código SUGEF-->
    <ng-container matColumnDef="sugef">
      <th mat-header-cell *matHeaderCellDef class="align-center">{{ 'country.table.sugef' | translate }}</th>
      <td mat-cell *matCellDef="let element" class="align-center">{{ element.sugef }}</td>
    </ng-container>

    <!--riesgo-->
    <ng-container matColumnDef="risk">
      <th mat-header-cell *matHeaderCellDef class="align-center">{{ 'country.table.risk' | translate }}</th>
      <td mat-cell *matCellDef="let element" class="align-center">{{ element.risk }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      [class.selected]="selectedRow === row"
      (click)="selectRow(row)"
    ></tr>
  </table>

  <!-- Botón flotante -->
  <button *ngIf="selectedRow" mat-raised-button class="floating-button">
    <mat-icon>edit</mat-icon>
    Reclasificar
  </button>
</div>
